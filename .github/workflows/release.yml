name: Build release apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_CPP_VERSION: v1.9.4

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install pyinstaller PyQt6 pynput
      - name: Test
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Build whisper.cpp
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp.git build/whisper.cpp
          cmake -S build/whisper.cpp -B build/whisper.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build build/whisper.cpp/build --target whisper-cli
      - name: Package Linux app
        env:
          WHISPER_CLI_BINARY: ${{ github.workspace }}/build/whisper.cpp/build/bin/whisper-cli
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: artifacts/OpenTalk-Linux-x86_64.tar.gz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build tools
        run: |
          brew install cmake ninja
          python -m pip install pyinstaller PyQt6 imageio-ffmpeg pynput
      - name: Test
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Build whisper.cpp
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp.git build/whisper.cpp
          cmake -S build/whisper.cpp -B build/whisper.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build build/whisper.cpp/build --target whisper-cli
      - name: Package Apple Silicon app
        env:
          WHISPER_CLI_BINARY: ${{ github.workspace }}/build/whisper.cpp/build/bin/whisper-cli
        run: |
          export FFMPEG_BINARY="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          file "$FFMPEG_BINARY" | grep -q arm64
          ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/OpenTalk-macOS-arm64.zip

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install pyinstaller PyQt6 imageio-ffmpeg pynput
      - name: Test
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Build whisper.cpp
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:WHISPER_CPP_VERSION https://github.com/ggml-org/whisper.cpp.git build/whisper.cpp
          cmake -S build/whisper.cpp -B build/whisper.cpp/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build build/whisper.cpp/build --target whisper-cli
      - name: Package Windows app
        shell: pwsh
        env:
          WHISPER_CLI_BINARY: ${{ github.workspace }}/build/whisper.cpp/build/bin/whisper-cli.exe
        run: |
          $env:FFMPEG_BINARY = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          ./scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/OpenTalk-Windows-x86_64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
