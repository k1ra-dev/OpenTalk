name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - run: python3 -m py_compile opentalk.py opentalk_gui.py audio_sources.py test_opentalk.py
